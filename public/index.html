<meta charset="utf-8">
<!-- No viewport-fit=cover, deliberately.
     With cover, the page extends UNDER the status bar and the home
     indicator and the page becomes responsible for painting those
     strips - which is why they showed as separate black or white bands
     instead of continuing the page. Without it, Safari insets the
     viewport and fills those strips with the page background itself,
     so the surface reads as one piece top to bottom. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff" id="themeColor">

<link rel="stylesheet" href="css/style.css">
<script>
/* Inline and blocking on purpose: the theme must be on <html> before
   the first paint, otherwise a night visitor gets a white flash. */
(function(){
  try{
    var saved = localStorage.getItem('se.theme');
    var h = new Date().getHours();
    var auto = (h >= 7 && h < 19) ? 'light' : 'dark';
    var theme = (saved === 'light' || saved === 'dark') ? saved : auto;
    document.documentElement.dataset.theme = theme;

    /* Set the browser-chrome colour here too, not just in app.js: the
       status bar is painted before the module loads, and a night
       visitor would otherwise get a white bar above a black page. */
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');
  }catch(e){ document.documentElement.dataset.theme = 'light'; }
})();
</script>

            <stop offset="100%" stop-color="currentColor" stop-opacity=".02"/>
